    <circle cx="0" cy="0" r="76" fill="url(#lensGrad)" stroke="#ffffff" stroke-width="14" />
    <circle cx="0" cy="0" r="36" fill="#042f2e" />
    <circle cx="-16" cy="-16" r="14" fill="#ffffff" />
    <circle cx="16" cy="16" r="6" fill="#ffffff" opacity="0.8" />
    <line x1="-220" y1="0" x2="-192" y2="0" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" />
    <line x1="192" y1="0" x2="220" y2="0" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="-140" x2="0" y2="-114" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="114" x2="0" y2="140" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
